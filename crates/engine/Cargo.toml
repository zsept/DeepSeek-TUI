[package]
name = "deepseek-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DeepSeek TUI engine: core loop, tool implementations, LLM client"

[dependencies]
deepseek-shared = { path = "../shared", version = "0.8.38" }
deepseek-capacity = { path = "../capacity", version = "0.8.38" }
deepseek-context = { path = "../context", version = "0.8.38" }
deepseek-base = { path = "../base", version = "0.8.38" }
deepseek-support = { path = "../support", version = "0.8.38" }
deepseek-config = { path = "../config", version = "0.8.38" }
deepseek-palette = { path = "../palette", version = "0.8.38" }
deepseek-models = { path = "../models", version = "0.8.38" }
deepseek-protocol = { path = "../protocol", version = "0.8.38" }
deepseek-sandbox = { path = "../sandbox", version = "0.8.38" }
deepseek-lsp = { path = "../lsp", version = "0.8.38" }
deepseek-snapshot = { path = "../snapshot", version = "0.8.38" }
deepseek-skills = { path = "../skills", version = "0.8.38" }
deepseek-execpolicy = { path = "../execpolicy", version = "0.8.38" }
deepseek-agent = { path = "../agent", version = "0.8.38" }
deepseek-mcp = { path = "../mcp", version = "0.8.38" }
deepseek-secrets = { path = "../secrets", version = "0.8.38" }
deepseek-utils = { path = "../utils", version = "0.8.38" }
deepseek-state = { path = "../state", version = "0.8.38" }
anyhow.workspace = true
async-stream = "0.3.6"
async-trait.workspace = true
base64 = "0.22.1"
axum = { version = "0.8.4", features = ["json"] }
chrono.workspace = true
clap = { version = "4.5.54", features = ["derive"] }
colored = "3.0.0"
crossterm = "0.28"
dirs.workspace = true
fd-lock = "4.0.4"
futures-util = "0.3.31"
ratatui = "0.30"
regex = "1.11"
reqwest.workspace = true
similar = "2"
serde.workspace = true
serde_json.workspace = true
schemars = { version = "1.2.1", features = ["derive", "preserve_order"] }
shellexpand = "3"
toml.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.16", features = ["io"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
uuid.workspace = true
tempfile = "3.16"
thiserror = "2.0"
tracing = "0.1"
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
wait-timeout = "0.2"
multimap = "0.10.0"
shlex = "1.3.0"
starlark = "0.13.0"
tiny_http = "0.12"
portable-pty = "0.8"
zeroize = "1.8.2"
ignore = "0.4"
pdf-extract = "0.7"
tar = "0.4"
flate2 = "1.1"
sha2.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
wiremock = "0.6"
pretty_assertions = "1.4"
vt100 = "0.15"
